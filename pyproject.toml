[tool.poetry]
name = "adma"
version = "0.1.0"
description = "ADMA"
authors = ["ADMA"]
readme = "README.md"
packages = [{include = "adma", from = "src"}]

[tool.poetry.dependencies]
python = "^3.12"
ultralytics = ">=8.0.0"
gradio = ">=4.0.0"
Pillow = ">=10.0.0"
numpy = ">=1.24.0"
opencv-python-headless = ">=4.8.0"
pyyaml = ">=6.0"
python-dotenv = ">=1.0.0"

[tool.poetry.group.dev.dependencies]
roboflow = ">=1.1.0"
pytest = ">=8.0.0"
ruff = ">=0.5.0"

[tool.poetry.scripts]
adma-app = "adma.app:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
